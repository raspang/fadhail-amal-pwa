    <!-- Tells Google this is a free app, and links it to the Android app -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Fadhail Amal",
        "alternateName": ["Fadhail-e-Amal Meranaw", "Totolan ko manga Sahabah"],
        "url": "https://raspang.github.io/fadhail-amal-pwa/",
        "image": "https://raspang.github.io/fadhail-amal-pwa/og-image.png",
        "description": "Fadhail-e-Amal in Meranaw (Maranao) and English, free on any phone or laptop.",
        "applicationCategory": "BookApplication",
        "operatingSystem": "Any",
        "inLanguage": ["mrw", "en"],
        "isAccessibleForFree": true,
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "PHP" },
        "author": { "@type": "Person", "name": "Mohammad Rasol Z. Pangcoga (iNZPdev)" },
        "sameAs": [
          "https://play.google.com/store/apps/details?id=com.nzpenterprises.totolankomgasahaba",
          "https://www.facebook.com/theiNZPire"
        ]
      }
    </script>
    <meta name="theme-color" content="#0b5d3b" />
    <meta name="color-scheme" content="light dark" />
    <!-- Apply the saved theme (Light by default, or Night) before the page draws, so it never flashes -->
    <script>
      try {
        var t = JSON.parse(localStorage.getItem('fa.theme')) === 'dark' ? 'dark' : 'light';
      } catch (e) {
        t = 'light';
      }
      document.documentElement.setAttribute('data-theme', t);
      document.querySelector('meta[name="theme-color"]').setAttribute('content', t === 'dark' ? '#091024' : '#0b5d3b');
    </script>
    <!-- iPhone: lets "Add to Home Screen" open it full screen like an app -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Fadhail Amal" />

    <link rel="apple-touch-icon" href="icons/icon-180x180.png" />
