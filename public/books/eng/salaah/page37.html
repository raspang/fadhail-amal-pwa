<body>
    <h5 class="item"><span class="font12" style="font-weight: bold">Story -5</span></h5>
    <p>
      <span class="font1"
        >It is said of a pious man that once he had a sore on his foot.
        According to the doctors, if his foot was not cut off, the sore might
        cause him to die. His mother suggested that the operation should be done
        while he was reading his salaah. This was done, and no pain was felt by
        him.</span
      >
    </p>
