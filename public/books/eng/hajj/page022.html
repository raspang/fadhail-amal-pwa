<h1 class="chapter">Chapter 2 - Grave Warnings For Not Performing Hajj</h1>
<p>Hajj is one of the pillars of Islam, and by the coming of Hajj into Islam did this religion become complete. (see first chapter). For those who fail or refuse (and are indifferent) to perform Hajj, severe warnings have been given.</p>
