<p class="chapter-label">Chapter 8: Ziyyaarat of Madinah (Visiting the Grave of Rasulullah (Sallaho Alaihe Wassallam))</p>
<h2 class="topic">Hadith Number One</h2>
<p>Hazrat Ibn Umar (RA) relates that Rasulullah (Sallaho Alaihe Wassallam) said: &quot;Whosoever visits my grave, my intercession becomes obligatory for him.&quot; (Bazaar-Dar-Qutni)</p>
