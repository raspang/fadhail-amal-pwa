      >
    </h5>
    <p>
      <span class="font2" style="font-weight: bold; font-style: italic"
        >Hadrat Abu Hurairah (Radhi Allaho anho) says that Rasulullah
        (Sallallaho alayhi wasallam) said, &quot;Whoever reads the five salaah
        will not be written amongst the neglectful; and whoever reads one
        hundred aayaat at night will be written among the obedient
        ones.&quot;</span
      >
    </p>
